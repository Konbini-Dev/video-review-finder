<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Review Finder</title>
  <meta name="description" content="A Chrome extension that shows video reviews for the Amazon product you are viewing.">
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --text: #1f2937; --muted: #4b5563; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f172a; --text: #e5e7eb; --muted: #9ca3af; --accent: #818cf8; } }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 56px 16px 64px; }
    h1 { font-size: 30px; line-height: 1.25; margin: 0 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
    .links a { margin-right: 16px; }
  </style>
</head>
<body>
<main>
  <h1>Video Review Finder</h1>
  <p>A Chrome extension that shows video reviews for the Amazon product you are viewing, in a panel on the product page. Nothing is looked up until you click its button.</p>
  <p class="links">
    <a href="privacy/">Privacy policy</a>
    <a href="mailto:kadokonbini@gmail.com">Contact</a>
  </p>
  <p>Made by Konbini Dev.</p>
</main>
</body>
</html>
